[tool.poetry]
name = "annealing"
version = "0.1.0"
description = "Simulated Annealing solver with a Travelling Salesman Problem application."
authors = ["Jovan Popovic <jovan.p@coinis.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "annealing", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26"
matplotlib = "^3.8"
typer = "^0.16"
rich = "^13.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.6"
black = "^24.0"
mypy = "^1.10"

[tool.poetry.scripts]
annealing = "annealing.cli.app:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "W",     # pycodestyle warnings
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "C90",   # mccabe
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "PTH",   # use pathlib
    "RUF",   # ruff-specific
    "TID",   # tidy imports
    "RET",   # flake8-return
    "ARG",   # unused arguments
    "PIE",   # misc good practices
]
ignore = [
    "E501",   # line length handled by black
    "B008",   # typer.Option in defaults is the canonical Typer pattern
    "UP036",  # _compat.py keeps the 3.10 branch on purpose for the sandbox
    "UP042",  # StrEnum backport must inherit from (str, Enum)
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
# Allow physics-style names (t0, T, alpha) as standard SA parameters.
extend-ignore-names = ["t0", "T", "T_*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
